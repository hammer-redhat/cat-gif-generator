name: Build and push container image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/hammer-redhat/cat-gif-generator:latest
            ghcr.io/hammer-redhat/cat-gif-generator:${{ steps.sha.outputs.short }}
          build-args: |
            NEXUS_USER=${{ secrets.NEXUS_USER }}
            NEXUS_PASS=${{ secrets.NEXUS_PASS }}
            NEXUS_PYPI_URL=${{ vars.NEXUS_PYPI_URL }}
          load: ${{ github.event_name == 'pull_request' }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/hammer-redhat/cat-gif-generator:${{ steps.sha.outputs.short }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM to Dependency-Track
        uses: DependencyTrack/gh-upload-sbom@v3
        with:
          serverhostname: ${{ vars.DTRACK_API_URL }}
          apikey: ${{ secrets.DTRACK_API_KEY }}
          projectname: cat-gif-generator
          projectversion: ${{ steps.sha.outputs.short }}
          autocreate: true
          bomfilename: sbom.cyclonedx.json
